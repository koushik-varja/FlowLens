services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowlens
      POSTGRES_USER: flowlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlens"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["flowlens_pg:/var/lib/postgresql/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flowlens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/flowlens
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes: {flowlens_pg: {}}
